openapi: 3.1.0
info:
  title: ArchView API
  version: 1.0.0
  description: Live Docker and Linux telemetry API used by ArchView.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness check
      description: Returns 503 when authentication is enabled and the identity provider cannot be reached.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Identity provider unavailable
  /auth/config:
    get:
      summary: Authentication configuration
      responses:
        '200':
          description: Public auth metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
  /auth/login:
    get:
      summary: Start OAuth login
      description: Redirects to the identity provider using the authorization code flow with PKCE. Use `format=json` to receive the authorization URL instead of a redirect.
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
          description: Relative path or allowlisted absolute URL to return to after login.
        - in: query
          name: format
          schema:
            type: string
            enum: [json]
      responses:
        '302':
          description: Redirect to the identity provider
        '200':
          description: Authorization URL (when `format=json`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl:
                    type: string
                  state:
                    type: string
  /auth/callback:
    get:
      summary: OAuth callback
      description: Validates state, nonce and the ID token, then sets the signed session cookie.
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Session created; redirects to the post-login target
        '400':
          description: Invalid or expired state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token validation failed
        '403':
          description: Account is not allowed
  /auth/logout:
    get:
      summary: Log out
      parameters:
        - in: query
          name: redirect
          schema:
            type: string
        - in: query
          name: federated
          schema:
            type: string
            enum: ['1']
          description: Also redirect to the provider end-session endpoint when available.
      responses:
        '200':
          description: Session cookie cleared
  /auth/user:
    get:
      summary: Current principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Authenticated principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/overview:
    get:
      summary: Host overview
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Live host overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/architecture:
    get:
      summary: Architecture overview
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: project
          required: true
          schema:
            type: string
          description: Project key. `travelling` and `image-mosaic` map to the image-mosaic project, `rossmoney` maps to `rossmoney_me`.
      responses:
        '200':
          description: Architecture payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/docker:
    get:
      summary: Docker daemon snapshot
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Docker inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/system:
    get:
      summary: Linux host snapshot
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Host metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
      description: |
        An OAuth 2.0 access token issued by the configured identity provider.

        Machine clients obtain one with the `client_credentials` grant and send it
        as `Authorization: Bearer <token>`. JWTs are verified against the provider
        JWKS; opaque tokens are validated with RFC 7662 introspection when
        `OAUTH_INTROSPECTION_URL` is configured. Static API keys are not supported.
    cookieAuth:
      type: apiKey
      in: cookie
      name: archview_session
      description: Signed session cookie created by `/auth/callback`. The cookie name is configurable with `SESSION_COOKIE_NAME`.
  responses:
    Unauthorized:
      description: Authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm challenge
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        loginUrl:
          type: string
    AuthConfig:
      type: object
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [none, oidc, oauth2]
        issuer:
          type: string
        loginUrl:
          type: string
        logoutUrl:
          type: string
        userUrl:
          type: string
        machine:
          type: object
          description: How a service obtains a token for this API with the OAuth 2.0 client credentials grant.
          properties:
            grant:
              type: string
              enum: [client_credentials]
            tokenType:
              type: string
            tokenUrl:
              type: string
              description: Identity provider token endpoint.
            audiences:
              type: array
              items:
                type: string
            scopes:
              type: array
              items:
                type: string
            introspection:
              type: boolean
              description: Opaque access tokens are validated with RFC 7662 introspection.
    Principal:
      type: object
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        provider:
          type: string
        method:
          type: string
          enum: [session, bearer, client_credentials]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
      required: [status, time]
    OverviewResponse:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        environment:
          type: string
        region:
          type: string
        cluster:
          type: string
        updatedAt:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceSummary'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeSummary'
        regions:
          type: array
          items:
            type: string
        diagram:
          type: string
          description: Topology text; it ends with an `endpoints` section that repeats the same absolute URLs as the `endpoints` array.
        docker:
          $ref: '#/components/schemas/DockerSnapshot'
        system:
          $ref: '#/components/schemas/SystemSnapshot'
        extra:
          type: object
          additionalProperties: true
        endpoints:
          type: array
          description: Absolute URLs for the API endpoints of the instance that served the request.
          items:
            $ref: '#/components/schemas/EndpointLink'
    EndpointLink:
      type: object
      properties:
        name:
          type: string
          description: Short endpoint name, for example `architecture`.
        url:
          type: string
          format: uri
          description: Absolute URL. The architecture entry uses `project=<name>` as a placeholder.
      required: [name, url]
    DockerSnapshot:
      type: object
      properties:
        daemon:
          $ref: '#/components/schemas/DockerDaemonSummary'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSummary'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageSummary'
    DockerDaemonSummary:
      type: object
      properties:
        operatingSystem:
          type: string
        architecture:
          type: string
        driver:
          type: string
        ncpu:
          type: integer
        memoryTotalBytes:
          type: integer
        containers:
          type: integer
        containersRunning:
          type: integer
        images:
          type: integer
    ContainerSummary:
      type: object
      properties:
        id:
          type: string
          description: Short container ID (first 12 characters).
        name:
          type: string
        image:
          type: string
        state:
          type: string
        status:
          type: string
        created:
          type: integer
    ImageSummary:
      type: object
      properties:
        repoTags:
          type: array
          items:
            type: string
        sizeBytes:
          type: integer
        created:
          type: integer
        dangling:
          type: boolean
    SystemSnapshot:
      type: object
      properties:
        hostname:
          type: string
          description: Kept deliberately so consumers can identify the host.
        os:
          type: string
          description: Kept deliberately for host identification.
        cpuCount:
          type: integer
        loadAverage:
          type: array
          items:
            type: number
        memory:
          $ref: '#/components/schemas/MemorySnapshot'
        processes:
          type: integer
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskSnapshot'
        network:
          type: array
          items:
            $ref: '#/components/schemas/NetworkSnapshot'
    MemorySnapshot:
      type: object
      properties:
        totalBytes:
          type: integer
        availableBytes:
          type: integer
        freeBytes:
          type: integer
        usedBytes:
          type: integer
        usedPercent:
          type: number
    DiskSnapshot:
      type: object
      properties:
        totalBytes:
          type: integer
        freeBytes:
          type: integer
        usedBytes:
          type: integer
        usedPercent:
          type: number
    NetworkSnapshot:
      type: object
      properties:
        receivedBytes:
          type: integer
        sentBytes:
          type: integer
    ServiceSummary:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        status:
          type: string
        image:
          type: string
        node:
          type: string
    NodeSummary:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        status:
          type: string
        details:
          type: object
          description: Safe details only. Container nodes expose `image` and `state`; host nodes have no details.
          additionalProperties:
            type: string
