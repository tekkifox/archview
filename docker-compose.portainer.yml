version: "3.8"

services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    env_file:
      - stack.env
    networks:
      - archview-stack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  archview:
    image: ghcr.io/tekkifox/archview:latest
    pull_policy: always
    env_file:
      - stack.env
    environment:
      PORT: "8083"
    networks:
      archview-stack:
      proxy:
        ipv4_address: 172.18.0.10
    depends_on:
      socket-proxy:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

networks:
  archview-stack:
    driver: bridge
  proxy:
    external: true
