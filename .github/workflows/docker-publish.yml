name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./docs)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Support multiple Portainer webhook URLs. Set either PORTAINER_WEBHOOK_URL (single)
      # or PORTAINER_WEBHOOK_URLS (comma- or newline-separated) as an Actions *variable*;
      # a repository secret of the same name is used as a fallback, so either works.
      # The DEV_* pair is used for pushes to the dev branch instead.
      PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS || secrets.PORTAINER_WEBHOOK_URLS }}
      PORTAINER_WEBHOOK_URL: ${{ vars.PORTAINER_WEBHOOK_URL || secrets.PORTAINER_WEBHOOK_URL }}
      PORTAINER_DEV_WEBHOOK_URLS: ${{ vars.PORTAINER_DEV_WEBHOOK_URLS || secrets.PORTAINER_DEV_WEBHOOK_URLS }}
      PORTAINER_DEV_WEBHOOK_URL: ${{ vars.PORTAINER_DEV_WEBHOOK_URL || secrets.PORTAINER_DEV_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Portainer webhook(s)
        run: |
          set -eu
          # main redeploys the production stack, dev redeploys the dev stack;
          # any other ref triggers neither.
          case "${GITHUB_REF_NAME:-}" in
            main) urls_raw="${PORTAINER_WEBHOOK_URLS:-} ${PORTAINER_WEBHOOK_URL:-}" ;;
            dev) urls_raw="${PORTAINER_DEV_WEBHOOK_URLS:-} ${PORTAINER_DEV_WEBHOOK_URL:-}" ;;
            *) urls_raw="" ;;
          esac
          failures=0
          echo "Triggering Portainer webhooks..."
          echo "$urls_raw" | tr ',' '\n' | while read -r url; do
            url_trim=$(echo "$url" | xargs)
            if [ -z "$url_trim" ]; then
              continue
            fi
            echo "POST $url_trim"
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url_trim" || true)
            if [ "$status" != "200" ] && [ "$status" != "202" ] && [ "$status" != "204" ] && [ "$status" != "409" ]; then
              echo "Portainer webhook $url_trim failed with HTTP $status"
              failures=$((failures+1))
            else
              echo "Portainer webhook $url_trim triggered OK (HTTP $status)"
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "One or more Portainer webhooks failed ($failures)"
            exit 1
          fi
