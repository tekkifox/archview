name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  # Pull requests only run the test job; every job that builds, pushes,
  # merges a manifest or deploys is gated to push events below.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The only job that runs on pull requests. It checks formatting, vet and the
  # race-enabled test suite, and never builds or pushes an image.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./docs)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Build linux/amd64 on the native x86 runner and push the image by digest only.
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/digest
          if-no-files-found: error
          retention-days: 1

  # Build linux/arm64 natively on a GitHub-hosted ARM runner. No emulation.
  build-arm64:
    runs-on: ubuntu-26.04-arm
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The whole point of this job is a native build. If the runner label is
      # ever pointed at an x86 machine the arm64 image would need emulation, so
      # fail here instead of quietly publishing something slower and stranger.
      - name: Assert the runner is arm64
        run: test "$(uname -m)" = "aarch64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/digest
          if-no-files-found: error
          retention-days: 1

  # Join both platform digests into the published multi-arch manifest.
  merge:
    runs-on: ubuntu-latest
    needs: [build, build-arm64]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: digests/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Publish multi-arch manifest
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/amd64/digest)"
          arm64_digest="$(cat digests/arm64/digest)"
          for digest in "$amd64_digest" "$arm64_digest"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest: $digest" >&2
              exit 1
            fi
          done
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "No tags produced by docker/metadata-action" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${amd64_digest}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${arm64_digest}"

      # A merge that silently drops a platform still pushes cleanly, and the
      # fleet would only notice on an ARM host at pull time. Read the index
      # back from the registry and fail the job unless both builds are in it,
      # so `deploy` cannot run on a half-published image.
      - name: Verify the published manifest lists both architectures
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag="$(head -n1 <<< "$TAGS")"
          manifest="${RUNNER_TEMP}/manifest.json"
          docker buildx imagetools inspect "$tag" --raw > "$manifest"

          media_type="$(jq -r '.mediaType // empty' "$manifest")"
          platforms="$(jq -r '.manifests[]?.platform
            | select(. != null)
            | "\(.os)/\(.architecture)"' "$manifest" | sort -u)"
          echo "mediaType: ${media_type}"
          echo "platforms:"
          echo "${platforms}"

          case "$media_type" in
            application/vnd.oci.image.index.v1+json | \
              application/vnd.docker.distribution.manifest.list.v2+json) ;;
            *)
              echo "Published ${tag} is not a manifest list" >&2
              exit 1
              ;;
          esac

          for want in linux/amd64 linux/arm64; do
            if ! grep -qx "$want" <<< "$platforms"; then
              echo "Published ${tag} is missing ${want}" >&2
              exit 1
            fi
          done

  # Redeploy every ArchView stack after the image is published. The fleet's
  # stacks are Ansible-managed files on disk, so the fleet deploy job asks the
  # deploy gateway over the tailnet to pull and recreate the named stack on the
  # named host. The gateway validates the host and stacks itself and refuses a
  # stack the host does not declare, so a wrong mapping fails loudly instead of
  # silently doing nothing.
  #
  # Vortex is not in the Ansible fleet inventory, so it deploys separately via
  # the vortex-deploy wrapper on a vortex self-hosted runner.
  #
  # These jobs are self-contained instead of calling reusable deploy workflows
  # in private infrastructure repositories, because a public repository cannot
  # call a reusable workflow stored in a private one and GitHub rejects it at
  # workflow load. Keep the transport in step with those reusable workflows.
  #
  # Three repository secrets are the contract: TS_AUTHKEY joins the tailnet,
  # DEPLOY_GATEWAY_SSH_KEY is this repository's private key for the gateway,
  # and DEPLOY_GATEWAY_KNOWN_HOSTS is the pinned gateway host key. The host key
  # is pinned rather than scanned at run time, so there is no accept-new and no
  # root SSH from a runner.
  deploy-fleet:
    name: Deploy ${{ matrix.stacks }} on ${{ matrix.host }}
    needs: [merge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: mgmt
            stacks: mgmt-archview
          - host: media
            stacks: media-archview
          - host: storage
            stacks: storage-archview
          - host: rossmoney
            stacks: rossmoney-archview
          - host: photos
            stacks: photos-archview
          - host: paseo
            stacks: paseo-archview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-archview-${{ github.run_id }}-${{ matrix.host }}

      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        env:
          TARGET_HOST: ${{ matrix.host }}
          TARGET_STACKS: ${{ matrix.stacks }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy $TARGET_HOST $TARGET_STACKS"

  deploy-vortex:
    name: Deploy vortex-archview on vortex
    needs: [merge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - X64
      - vortexservers
    environment: production
    steps:
      - name: Deploy via vortex-deploy
        env:
          STACKS: vortex-archview
        run: |
          set -euo pipefail
          sudo /usr/local/bin/vortex-deploy "$STACKS" deploy
