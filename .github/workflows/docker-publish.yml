name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./docs)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Build linux/amd64 on the native x86 runner and push the image by digest only.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/digest
          if-no-files-found: error
          retention-days: 1

  # Build linux/arm64 natively on a GitHub-hosted ARM runner. No emulation.
  build-arm64:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/digest
          if-no-files-found: error
          retention-days: 1

  # Join both platform digests into the published multi-arch manifest, then notify Portainer.
  merge:
    runs-on: ubuntu-latest
    needs: [build, build-arm64]
    env:
      # Support multiple Portainer webhook URLs. Set either PORTAINER_WEBHOOK_URL (single)
      # or PORTAINER_WEBHOOK_URLS (comma- or newline-separated) as an Actions *variable*;
      # a repository secret of the same name is used as a fallback, so either works.
      # The DEV_* pair is used for pushes to the dev branch instead.
      PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS || secrets.PORTAINER_WEBHOOK_URLS }}
      PORTAINER_WEBHOOK_URL: ${{ vars.PORTAINER_WEBHOOK_URL || secrets.PORTAINER_WEBHOOK_URL }}
      PORTAINER_DEV_WEBHOOK_URLS: ${{ vars.PORTAINER_DEV_WEBHOOK_URLS || secrets.PORTAINER_DEV_WEBHOOK_URLS }}
      PORTAINER_DEV_WEBHOOK_URL: ${{ vars.PORTAINER_DEV_WEBHOOK_URL || secrets.PORTAINER_DEV_WEBHOOK_URL }}
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: digests/amd64

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: digests/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/archview
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Publish multi-arch manifest
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/amd64/digest)"
          arm64_digest="$(cat digests/arm64/digest)"
          for digest in "$amd64_digest" "$arm64_digest"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest: $digest" >&2
              exit 1
            fi
          done
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "No tags produced by docker/metadata-action" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${amd64_digest}" \
            "ghcr.io/${GITHUB_REPOSITORY}@${arm64_digest}"

      - name: Trigger Portainer webhook(s)
        run: |
          set -eu
          # main redeploys the production stack, dev redeploys the dev stack;
          # any other ref triggers neither.
          case "${GITHUB_REF_NAME:-}" in
            main) urls_raw="${PORTAINER_WEBHOOK_URLS:-}"$'\n'"${PORTAINER_WEBHOOK_URL:-}" ;;
            dev) urls_raw="${PORTAINER_DEV_WEBHOOK_URLS:-}"$'\n'"${PORTAINER_DEV_WEBHOOK_URL:-}" ;;
            *) urls_raw="" ;;
          esac
          # Values can arrive comma-separated, newline-separated, wrapped in quotes,
          # or with a trailing carriage return after a copy/paste. Normalise them
          # before handing them to curl, which rejects anything malformed outright.
          urls=$(printf '%s' "$urls_raw" \
            | tr ',\r' '\n\n' \
            | tr -d '"' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^$' || true)
          failures=0
          echo "Triggering Portainer webhooks..."
          if [ -z "$urls" ]; then
            echo "No Portainer webhook configured for ${GITHUB_REF_NAME:-this ref}; nothing to do."
            exit 0
          fi
          while IFS= read -r url; do
            echo "POST $url"
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url" || true)
            case "$status" in
              200|202|204|409)
                echo "Portainer webhook triggered OK (HTTP $status)"
                ;;
              *)
                echo "Portainer webhook $url failed with HTTP $status"
                failures=$((failures + 1))
                ;;
            esac
          done <<< "$urls"
          if [ "$failures" -gt 0 ]; then
            echo "One or more Portainer webhooks failed ($failures)"
            exit 1
          fi
